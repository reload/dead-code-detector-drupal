---
name: Lint
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          make lint-actions
  markdownlint:
    name: markdown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: xt0rted/markdownlint-problem-matcher@v3
      - name: Run markdownlint
        run: make lint-markdown
  yamllint:
    name: Yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run Yamllint
        run: make lint-yaml
  commitlint:
    name: Commit messages
    # Dependabot's subjects start with a capital, which the convention forbids
    # and Dependabot cannot change; they carry a type, which is what matters.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The base branch too, to find the commits the pull request adds.
          fetch-depth: 0
      - name: Run commitlint
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make lint-commits BASE="origin/$BASE_REF"
