---
name: Lint
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          make lint-actions
  markdownlint:
    name: markdown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: xt0rted/markdownlint-problem-matcher@v3
      - name: Run markdownlint
        run: make lint-markdown
  yamllint:
    name: Yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run Yamllint
        run: make lint-yaml
