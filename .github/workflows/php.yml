---
on:
  pull_request:
  push:
    branches:
      - main
name: PHP

permissions:
  contents: read

# Detect if this action is already running, and cancel it.
# This most likely happened because a second push has been made to a branch.
concurrency:
  group: ${{ github.repository_id }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PHP versions composer.json allows, so the matrix follows its constraint.
  php-versions:
    name: PHP versions
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.range.outputs.version }}
      lowest: ${{ steps.range.outputs.lowest }}
    steps:
      - uses: actions/checkout@v7
      - id: range
        uses: WyriHaximus/github-action-composer-php-versions-in-range@v2

  php:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
    needs: php-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(needs.php-versions.outputs.versions) }}
        dependencies:
          - lowest
          - highest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP, with composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: make validate-composer

      - name: Install the ${{ matrix.dependencies }} dependencies
        run: make dependencies-${{ matrix.dependencies }}

      - name: Run phpcs
        run: make lint-php

      - name: Run PHPStan
        run: make analyse-php

      - name: Run PHPUnit
        run: make test-php

  mutation:
    name: Mutation
    needs: php-versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP, with composer and pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.php-versions.outputs.lowest }}
          tools: composer
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # On the runner's own PHP, so Infection's annotations point at the files.
      - name: Mutation-test the decision classes
        run: make test-mutation IN_DOCKER=
